name = "adir-lead-intake"
main = "src/index.js"
compatibility_date = "2024-11-01"

# KV namespace used for per-IP rate limiting.
# Create with: wrangler kv namespace create RATE_LIMIT_KV
# Then paste the returned "id" below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "0f36711f72314440a37d2b5487d4e163"

# Secrets (set with `wrangler secret put <NAME>`, never written here):
#   AIRTABLE_TOKEN
#   AIRTABLE_BASE_ID
#   AIRTABLE_TABLE_NAME
#   ALLOWED_ORIGIN   (one origin, or several separated by commas)
